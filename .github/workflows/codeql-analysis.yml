# Release test gate. See RELEASING.md.
# This workflow runs only after CodeQL default setup is turned off.
# Default setup blocks this file.
name: CodeQL

on:
  push:
    branches: [edge]
  pull_request:
    branches: [edge]
  schedule:
    - cron: "0 23 * * 1"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
